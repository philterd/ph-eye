name: docs
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
        working-directory: ./docs
      - name: Extract version
        id: version
        run: echo "version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"(.+?)\"', open('app.py').read()).group(1))")" >> $GITHUB_OUTPUT
      - name: Deploy docs (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: mike deploy ${{ steps.version.outputs.version }} latest --update-aliases --push
        working-directory: ./docs
      - name: Deploy docs (dev)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: mike deploy dev --push
        working-directory: ./docs
      - name: Set default version
        if: startsWith(github.ref, 'refs/tags/v')
        run: mike set-default latest --push
        working-directory: ./docs
