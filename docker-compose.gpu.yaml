services:

  pii-base:
    image: philterd/ph-eye:1.2.5-pii_base-gpu
    ports:
      - "5001:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

